<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d4b39"><title>إذاعة النتشة للقرآن الكريم</title><style>body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(145deg,#fffaf0,#edf8f2);color:#17372d;min-height:100vh}.w{width:min(760px,94%);margin:auto;padding:24px 0}.c{background:#fff;border:1px solid #e7d8ad;border-radius:28px;padding:22px;box-shadow:0 16px 45px #0d4b3928;text-align:center}.s{width:88px;height:88px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,#167054,#0d4b39);color:#d9b65d;border:4px solid #d9b65d;font-size:40px}h1{font-size:clamp(30px,7vw,48px);color:#0d4b39;margin:14px 0}.n{font-size:clamp(25px,6vw,38px);font-weight:900;line-height:1.6;margin:22px 0}.st{font-size:20px;color:#765d24;min-height:32px}.p{width:210px;height:210px;border-radius:50%;border:9px solid #f2d98e;background:linear-gradient(145deg,#167054,#0d4b39);color:white;font-size:62px;cursor:pointer;margin:20px}.sel{width:100%;padding:16px;border:1px solid #ddc98e;border-radius:16px;font-size:19px;font-weight:bold;background:white}.a{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.a button,.back{border:0;border-radius:15px;padding:15px;font-size:18px;font-weight:900;background:#e6f5ee;color:#0d4b39;cursor:pointer}.back{display:inline-block;text-decoration:none;margin-top:18px}small{display:block;color:#6d7b75;line-height:1.8;margin-top:16px}@media(max-width:550px){.a{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="c"><div class="s">۞</div><h1>إذاعة النتشة للقرآن الكريم</h1><p>صدقة جارية عن أحياء وأموات عائلة النتشة</p><div id="name" class="n">جارٍ تحميل القرّاء…</div><div id="status" class="st">يرجى الانتظار</div><button id="play" class="p">▶</button><select id="stations" class="sel"><option>جارٍ التحميل…</option></select><div class="a"><button id="next">تجربة محطة أخرى</button><button id="share">مشاركة الإذاعة</button></div><audio id="audio" preload="none"></audio><a class="back" href="./">العودة للمسبحة والأذكار</a><small>عند توقف أي بث ينتقل المشغل تلقائيًا إلى محطة أخرى. مصدر المحطات: MP3Quran.</small></div></main><script>const API='https://www.mp3quran.net/api/v3/radios?language=ar',a=document.getElementById('audio'),s=document.getElementById('stations'),p=document.getElementById('play'),n=document.getElementById('name'),st=document.getElementById('status');let list=[],i=0,on=false,f=0;function set(x){if(!list.length)return;i=(x+list.length)%list.length;let r=list[i];a.pause();a.src=r.url;n.textContent=r.name;s.value=i;on=false;p.textContent='▶';st.textContent='جاهز للتشغيل'}async function load(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;let d=await r.json();list=(d.radios||[]).filter(x=>x.url&&/^https?:\/\//.test(x.url));s.innerHTML='';list.forEach((x,j)=>{let o=document.createElement('option');o.value=j;o.textContent=x.name;s.appendChild(o)});if(!list.length)throw 0;set(0)}catch(e){n.textContent='تعذر تحميل المحطات';st.textContent='تحقق من الإنترنت ثم أعد فتح الصفحة';s.innerHTML='<option>غير متاحة الآن</option>'}}async function start(){if(!list.length)return;try{st.textContent='جارٍ بدء البث…';await a.play();on=true;f=0;p.textContent='❚❚';st.textContent='يعمل الآن'}catch(e){next(true)}}function next(auto=false){if(!list.length)return;f++;if(f>Math.min(15,list.length)){st.textContent='تعذر العثور على محطة عاملة الآن';return}set(i+1);st.textContent='جارٍ تجربة محطة أخرى…';if(auto)setTimeout(start,600)}p.onclick=()=>{if(on){a.pause();on=false;p.textContent='▶';st.textContent='تم الإيقاف مؤقتًا'}else start()};s.onchange=()=>{f=0;set(+s.value)};document.getElementById('next').onclick=()=>{f=0;next(true)};a.addEventListener('waiting',()=>st.textContent='جارٍ تحميل البث…');a.addEventListener('playing',()=>st.textContent='يعمل الآن');a.addEventListener('error',()=>{if(a.src)next(true)});document.getElementById('share').onclick=async()=>{let d={title:'إذاعة النتشة للقرآن الكريم',text:'📖 إذاعة النتشة للقرآن الكريم — صدقة جارية عن أحياء وأموات عائلة النتشة',url:location.href};if(navigator.share)await navigator.share(d).catch(()=>{});else{await navigator.clipboard.writeText(location.href);st.textContent='تم نسخ الرابط'}};load();</script></body></html>
