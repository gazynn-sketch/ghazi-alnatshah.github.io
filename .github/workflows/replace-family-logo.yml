name: Replace family logo
on:
  push:
    paths:
      - '.github/workflows/replace-family-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace symbol with family logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.seal{width:90px;height:90px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,var(--g),var(--g2));color:var(--gold);border:4px solid var(--gold);font-size:42px;box-shadow:var(--shadow)}'
          new_css = '.seal{width:118px;height:118px;border-radius:50%;margin:auto;display:block;object-fit:cover;background:#fff;border:4px solid var(--gold);padding:4px;box-shadow:var(--shadow)}'
          old_html = '<header><div class="seal">۞</div>'
          new_html = '<header><img class="seal" src="natsha-family-logo.png" alt="شعار عائلة النتشة">'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          if old_html in s:
              s = s.replace(old_html, new_html, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Display Natsha family logo"
          git push
