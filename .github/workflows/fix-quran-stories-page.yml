name: Fix Quran stories page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quran-stories-page.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('quran-stories-kids.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("let current=null;const completed=new Set(JSON.parse(localStorage.nsKidsStoriesDone||'[]'));", "let current=null;let savedStories=[];try{savedStories=JSON.parse(localStorage.getItem('nsKidsStoriesDone')||'[]');if(!Array.isArray(savedStories))savedStories=[]}catch(e){savedStories=[];localStorage.removeItem('nsKidsStoriesDone')}const completed=new Set(savedStories);")
          s = s.replace("document.getElementById('back').onclick=()=>{speechSynthesis.cancel();", "document.getElementById('back').onclick=()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel();")
          s = s.replace("document.getElementById('listen').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.title+'. '+current.text);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)};", "document.getElementById('listen').onclick=()=>{if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('الاستماع الصوتي غير مدعوم على هذا الجهاز حاليًا');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.title+'. '+current.text);u.lang='ar-SA';u.rate=.85;window.speechSynthesis.speak(u)};")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          import re
          t = re.sub(r"const CACHE='natsha-v\d+'", "const CACHE='natsha-v17'", t, count=1)
          sw.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quran-stories-kids.html sw.js
          git commit -m "Fix Quran stories page compatibility" || exit 0
          git push
