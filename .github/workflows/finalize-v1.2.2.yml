name: Finalize v1.2.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-v1.2.2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Finalize site files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('family-admin.html')
          s = p.read_text(encoding='utf-8')
          if 'message-sender.html' not in s:
              marker = '<a class="light" href="join-notifications.html">➕ رابط الانضمام</a>'
              s = s.replace(marker, marker + '<a class="light" href="message-sender.html">📨 واتساب وSMS</a>')
          old = 'إرسال واتساب الآلي يحتاج WhatsApp Business Cloud API ورقم أعمال وقوالب رسائل معتمدة. الأرقام لا تُعرض للعامة، ولا يرسل النظام إلا للموافقين صراحةً.'
          new = 'للإرسال من الهاتف الشخصي استخدم صفحة واتساب وSMS: قائمة الإرسال تُحفظ محليًا على جهازك، ويفتح التطبيق واتساب أو تطبيق الرسائل لتأكيد الإرسال بنفسك.'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          m = re.search(r"CACHE\s*=\s*['\"]natsha-v(\d+)['\"]", s)
          if m:
              s = s[:m.start(1)] + str(int(m.group(1)) + 1) + s[m.end(1):]
          if 'message-sender.html' not in s:
              s = s.replace("'family-admin.html',", "'family-admin.html','message-sender.html',", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('privacy.html')
          s = p.read_text(encoding='utf-8')
          if 'قائمة أرقام الإرسال' not in s:
              block = '''\n<h2>واتساب والرسائل النصية</h2>\n<ul>\n<li>قائمة أرقام الإرسال التي يضيفها المستخدم يدويًا تُحفظ محليًا على جهازه ولا تُرفع إلى خادم التطبيق.</li>\n<li>عند اختيار واتساب أو SMS يفتح التطبيق تطبيق المراسلة على الجهاز، ولا يتم الإرسال إلا بعد تأكيد المستخدم.</li>\n</ul>\n'''
              s = s.replace('<h2>الأطفال</h2>', block + '<h2>الأطفال</h2>')
          s = s.replace('عند تفعيل الأذان، يستخدم التطبيق خدمة تشغيل مؤقتة في الخلفية لتشغيل الأذان، ويظهر إشعار دائم أثناء التشغيل مع زر لإيقافه.', 'عند تفعيل تنبيه الصلاة، يستخدم التطبيق خدمة تشغيل مؤقتة في الخلفية لتشغيل مقطع بداية الأذان فقط عند دخول الوقت، ويظهر إشعار أثناء التشغيل مع زر لإيقافه.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit finalization
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add family-admin.html sw.js privacy.html
          git diff --cached --quiet || git commit -m 'Finalize v1.2.2 messaging and privacy'
          git push
