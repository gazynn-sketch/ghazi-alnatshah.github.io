name: Add Mushaf Link
on:
  push:
    paths:
      - '.github/workflows/add-mushaf-link.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Mushaf page
        run: python3 .github/scripts/add_mushaf_link.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Link complete Quran reader"
          git push
