name: Remove standalone notification buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-standalone-admin-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove standalone signup link and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          targets = [
              '<a class="radioLink" href="join-notifications.html">📲 الانضمام لإشعارات العائلة</a>',
              '<a class="radioLink" href="family-admin.html">🛡️ دخول مشرفي المناسبات</a>'
          ]
          changed = False
          for target in targets:
              if target in text:
                  text = text.replace(target, '', 1)
                  changed = True
          if not changed:
              raise SystemExit('No standalone notification links found in index.html')
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("const CACHE='natsha-v13'", "const CACHE='natsha-v14'", 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Remove standalone notification signup buttons" || exit 0
          git push
