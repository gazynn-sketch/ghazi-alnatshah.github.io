name: Remove standalone admin button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-standalone-admin-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove standalone admin link and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          target = '<a class="radioLink" href="family-admin.html">🛡️ دخول مشرفي المناسبات</a>'
          if target not in text:
              raise SystemExit('Standalone admin link not found in index.html')
          text = text.replace(target, '', 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("const CACHE='natsha-v12'", "const CACHE='natsha-v13'", 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Remove standalone admin login button" || exit 0
          git push
