name: Complete Natsha Site V2
on:
  push:
    paths:
      - '.github/workflows/complete-site-v2.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade site
        run: python3 upgrade_v2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply Natsha site v2 upgrade"
          git push
