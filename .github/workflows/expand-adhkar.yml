name: Expand Adhkar Sections
on:
  push:
    paths:
      - '.github/workflows/expand-adhkar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand adhkar categories
        run: python3 .github/scripts/expand_adhkar.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Expand adhkar sections"
          git push
