name: Add Umrah Guide
on:
  push:
    paths:
      - '.github/workflows/add-umrah.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Umrah guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('قرآن كريم ومصحف وأذكار ومسبحة ومواقيت الصلاة واتجاه القبلة','قرآن كريم ومصحف وأذكار ومسبحة ومواقيت الصلاة واتجاه القبلة ومناسك العمرة')
          s=s.replace('قرآن ومصحف صوتي • أذكار شاملة • مسبحة عالمية • مواقيت الصلاة • القبلة','قرآن ومصحف صوتي • أذكار شاملة • مسبحة عالمية • مواقيت الصلاة • القبلة • مناسك العمرة')
          s=s.replace('قرآن كريم • مصحف • أذكار • مسبحة • مواقيت الصلاة • القبلة</div>','قرآن كريم • مصحف • أذكار • مسبحة • مواقيت الصلاة • القبلة • مناسك العمرة</div>')
          qibla_btn='<button class="mainBtn" onclick="location.href=\'qibla.html\'"><span>🧭</span>اتجاه القبلة</button>'
          umrah_btn='<button class="mainBtn" onclick="location.href=\'umrah.html\'"><span>🕋</span>مناسك العمرة خطوة بخطوة</button>'
          if 'umrah.html' not in s:
              s=s.replace(qibla_btn,qibla_btn+umrah_btn,1)
              qibla_link='<a class="radioLink" href="qibla.html">🧭 اتجاه القبلة</a>'
              s=s.replace(qibla_link,qibla_link+'<a class="radioLink" href="umrah.html">🕋 مناسك العمرة</a>',1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const CACHE='natsha-v\d+'","const CACHE='natsha-v5'",t,1)
          if "'umrah.html'" not in t:
              t=t.replace("'quran-player.html'","'quran-player.html','umrah.html'",1)
          sw.write_text(t,encoding='utf-8')

          m=Path('manifest.json')
          x=m.read_text(encoding='utf-8')
          x=x.replace('قرآن كريم وأذكار ومسبحة إلكترونية','قرآن ومصحف وأذكار ومسبحة ومواقيت الصلاة والقبلة ومناسك العمرة')
          m.write_text(x,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html sw.js manifest.json
          git diff --cached --quiet || git commit -m "Add Umrah guide to app"
          git push