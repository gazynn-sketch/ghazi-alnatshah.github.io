name: Add Firebase push integration

on:
  push:
    paths:
      - '.github/firebase-push-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Firebase push integration
        run: python .github/scripts/add_firebase_push.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add android-app index.html .github/workflows/build-android-apk.yml
          git diff --cached --quiet || git commit -m "Integrate Firebase Cloud Messaging for Android"
          git push
