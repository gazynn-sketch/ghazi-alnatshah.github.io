name: Add APK Download Button

on:
  push:
    paths:
      - '.github/workflows/add-apk-download-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Android APK download button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          button = '<button class="mainBtn" onclick="location.href=\'downloads/Natsha-Family-v1.0.0.apk\'"><span>📱</span>تحميل تطبيق أندرويد APK</button>'
          if 'downloads/Natsha-Family-v1.0.0.apk' not in s:
              marker = '<button class="mainBtn" onclick="location.href=\'umrah.html\'"><span>🕋</span>مناسك العمرة خطوة بخطوة</button>'
              if marker not in s:
                  raise SystemExit('Could not find Umrah button marker')
              s = s.replace(marker, marker + button, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Android APK download button"
          git push
