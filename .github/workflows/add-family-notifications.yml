name: Add Family Notifications Button

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-family-notifications.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link notifications center in app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          button="<button class=\"mainBtn\" onclick=\"location.href='notifications.html'\"><span>🔔</span>إشعارات العائلة</button>"
          kids="<button class=\"mainBtn\" onclick=\"location.href='kids-memorization.html'\"><span>🌟</span>تحفيظ القرآن للأطفال</button>"
          if button not in s and kids in s:
              s=s.replace(kids,kids+button,1)
          qlink="<a class=\"radioLink\" href=\"notifications.html\">🔔 إشعارات العائلة</a>"
          kidslink="<a class=\"radioLink\" href=\"kids-memorization.html\">🌟 تحفيظ القرآن للأطفال</a>"
          if qlink not in s and kidslink in s:
              s=s.replace(kidslink,kidslink+qlink,1)
          s=s.replace('تحفيظ الأطفال • أذكار','تحفيظ الأطفال • إشعارات العائلة • أذكار')
          s=s.replace('تحفيظ القرآن للأطفال • أذكار','تحفيظ القرآن للأطفال • إشعارات العائلة • أذكار')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add family notifications center to main app"
          git push
