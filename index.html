<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>سبحة إلكترونية - Ghazi Alnatshah</title>

<style>
body{
background:#0f172a;
font-family:Arial;
text-align:center;
color:white;
margin-top:120px;
}

h1{
font-size:40px;
}

.counter{
font-size:80px;
margin:30px;
}

button{
font-size:28px;
padding:20px 40px;
border-radius:12px;
border:none;
cursor:pointer;
margin:10px;
}

.tasbeh{
background:#22c55e;
color:white;
}

.reset{
background:#ef4444;
color:white;
}
</style>

</head>

<body>

<h1>سبحة إلكترونية</h1>
<h3>Ghazi Alnatshah</h3>

<div class="counter" id="count">0</div>

<button class="tasbeh" onclick="add()">تسبيح</button>
<br>
<button class="reset" onclick="reset()">تصفير</button>

<script>

let count = 0

function add(){
count++
document.getElementById("count").innerText = count
}

function reset(){
count = 0
document.getElementById("count").innerText = count
}

</script>

</body>
</html>
