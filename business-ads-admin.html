<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4b39"><title>إدارة إعلانات الأعمال - عائلة النتشة</title><style>:root{--g:#0d4b39;--g2:#167054;--gold:#d9b65d;--red:#a63b32;--ink:#17372d;--muted:#6b7771}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#fffaf0,#edf8f2);color:var(--ink)}.wrap{width:min(980px,94%);margin:auto;padding:24px 0 50px}h1,h2{color:var(--g);text-align:center}.card{background:#fff;border:1px solid #e4d4a5;border-radius:22px;padding:18px;margin-top:15px;box-shadow:0 12px 35px rgba(13,75,57,.11)}label{font-weight:800;color:var(--g);display:block}input,select,textarea{width:100%;padding:11px;border:2px solid #dfd0a6;border-radius:12px;margin-top:6px;font:inherit}textarea{min-height:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.btn{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:900;cursor:pointer;background:var(--g);color:#fff}.light{background:#e7f4ed;color:var(--g)}.danger{background:var(--red)}.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.top a{text-decoration:none}.status{text-align:center;padding:10px;font-weight:800}.err{color:var(--red)}.hidden{display:none!important}.ads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.ad{background:#fff;border:1px solid #e4d4a5;border-radius:18px;padding:15px}.ad h3{color:var(--g);margin:0 0 6px}.meta{font-size:14px;color:var(--muted);line-height:1.7}.desc{white-space:pre-wrap;line-height:1.7;margin:10px 0}.actions{display:flex;gap:8px}.actions button{flex:1}.adminName{text-align:center;color:#765d24;font-weight:900}.note{font-size:13px;line-height:1.8;color:var(--muted)}@media(max-width:700px){.grid,.ads{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><a class="btn light" href="business-ads.html">← العودة للإعلانات</a></div><h1>🛠️ إدارة إعلانات الأعمال</h1><section id="loginCard" class="card"><h2>دخول المشرفين</h2><div class="grid"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username"></label><label>رمز المشرف<input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label><button id="loginBtn" class="btn full">دخول</button></div><div id="loginStatus" class="status"></div></section><section id="manager" class="hidden"><div id="adminName" class="adminName"></div><div class="top" style="margin-top:10px"><button id="refreshBtn" class="btn light">↻ تحديث</button><button id="logoutBtn" class="btn light">تسجيل الخروج</button></div><div id="listStatus" class="status"></div><div id="ads" class="ads"></div></section><section id="editCard" class="card hidden"><h2>تعديل الإعلان</h2><div class="grid"><input id="adId" type="hidden"><label>اسم النشاط *<input id="businessName"></label><label>صاحب النشاط *<input id="ownerName"></label><label>التصنيف *<input id="category"></label><label>المدينة<input id="city"></label><label>الهاتف *<input id="phone"></label><label>واتساب<input id="whatsapp"></label><label class="full">الوصف *<textarea id="description"></textarea></label><label>رابط الصفحة<input id="website"></label><label>رابط الموقع على الخريطة<input id="locationUrl"></label><label>تاريخ الانتهاء<input id="expiresAt" type="date"></label><div class="full note">تعديل المشرف يحافظ على الصور والفيديو الحالية كما هي. الحذف يزيل الإعلان من العرض العام مع الاحتفاظ بسجله في قاعدة البيانات.</div><button id="saveBtn" class="btn full">حفظ التعديلات</button><button id="cancelBtn" class="btn light full">إلغاء</button></div><div id="editStatus" class="status"></div></section></main><script src="notifications-config.js?v=20260827-1"></script><script>const cfg=window.NATSHA_NOTICE_CONFIG||{},$=id=>document.getElementById(id);let token=sessionStorage.getItem('natshaAdminToken')||'',admin=null,ads=[];function status(id,msg,ok=true){const e=$(id);e.textContent=msg;e.className='status'+(ok?'':' err')}async function api(action,data={},method='POST'){if(!cfg.apiUrl)throw new Error('رابط الخادم غير مضبوط');if(method==='GET'){const r=await fetch(cfg.apiUrl+'?action='+encodeURIComponent(action)+'&v='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw new Error(j.error||'فشل الطلب');return j}const r=await fetch(cfg.apiUrl,{method:'POST',body:new URLSearchParams({payload:JSON.stringify({action,...data})})}),j=await r.json();if(!j.ok)throw new Error(j.error||'فشل الطلب');return j}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function restoreSession(){if(!token)return;try{const j=await api('session',{token});admin=j.admin;showManager();await loadAds()}catch(_){token='';sessionStorage.removeItem('natshaAdminToken')}}function showManager(){$('loginCard').classList.add('hidden');$('manager').classList.remove('hidden');$('adminName').textContent='المشرف: '+(admin?.name||admin?.email||'')}function showLogin(){$('loginCard').classList.remove('hidden');$('manager').classList.add('hidden');$('editCard').classList.add('hidden')}$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),pin=$('pin').value.trim();$('loginBtn').disabled=true;status('loginStatus','جاري التحقق...');try{const j=await api('login',{email,pin});token=j.token;admin=j.admin;sessionStorage.setItem('natshaAdminToken',token);showManager();await loadAds()}catch(e){status('loginStatus',e.message,false)}finally{$('loginBtn').disabled=false}};$('logoutBtn').onclick=()=>{token='';admin=null;sessionStorage.removeItem('natshaAdminToken');showLogin()};$('refreshBtn').onclick=loadAds;async function loadAds(){status('listStatus','جاري تحميل الإعلانات...');try{const j=await api('listBusinessAds',{},'GET');ads=Array.isArray(j.ads)?j.ads:[];render();status('listStatus','عدد الإعلانات: '+ads.length)}catch(e){status('listStatus',e.message,false)}}function render(){$('ads').innerHTML=ads.map((a,i)=>'<article class="ad"><h3>'+esc(a.businessName)+'</h3><div class="meta">'+esc(a.ownerName)+'<br>'+esc(a.category)+(a.city?'<br>📍 '+esc(a.city):'')+'</div><div class="desc">'+esc(a.description)+'</div><div class="actions"><button class="btn edit" data-i="'+i+'">✏️ تعديل</button>'+((admin&&admin.role!=='editor')?'<button class="btn danger del" data-i="'+i+'">🗑️ حذف</button>':'')+'</div></article>').join('')||'<div class="card">لا توجد إعلانات.</div>';$('ads').querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(ads[Number(b.dataset.i)]));$('ads').querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteAd(ads[Number(b.dataset.i)]))}function openEdit(a){$('adId').value=a.id;$('businessName').value=a.businessName||'';$('ownerName').value=a.ownerName||'';$('category').value=a.category||'';$('city').value=a.city||'';$('phone').value=a.phone||'';$('whatsapp').value=a.whatsapp||'';$('description').value=a.description||'';$('website').value=a.website||'';$('locationUrl').value=a.locationUrl||'';$('expiresAt').value=a.expiresAt||'';$('editCard').classList.remove('hidden');window.scrollTo({top:$('editCard').offsetTop-10,behavior:'smooth'})}$('cancelBtn').onclick=()=>{$('editCard').classList.add('hidden')};$('saveBtn').onclick=async()=>{const data={adminAction:'update',token,adId:$('adId').value,businessName:$('businessName').value.trim(),ownerName:$('ownerName').value.trim(),category:$('category').value.trim(),city:$('city').value.trim(),phone:$('phone').value.trim(),whatsapp:$('whatsapp').value.trim(),description:$('description').value.trim(),website:$('website').value.trim(),locationUrl:$('locationUrl').value.trim(),expiresAt:$('expiresAt').value};$('saveBtn').disabled=true;status('editStatus','جاري الحفظ...');try{await api('businessAdsSession',data);status('editStatus','تم حفظ التعديلات بنجاح');$('editCard').classList.add('hidden');await loadAds()}catch(e){status('editStatus',e.message,false)}finally{$('saveBtn').disabled=false}};async function deleteAd(a){if(!confirm('هل تريد حذف إعلان «'+a.businessName+'»؟ سيختفي من التطبيق فورًا.'))return;try{await api('businessAdsSession',{adminAction:'delete',token,adId:a.id});await loadAds()}catch(e){alert(e.message)}}restoreSession();</script></body></html>
