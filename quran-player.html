<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4b39"><title>الاستماع للقرآن | عائلة النتشة</title>
<style>
:root{--g:#0d4b39;--g2:#167054;--gold:#d9b65d;--ink:#17372d;--muted:#6d7b75;--shadow:0 14px 38px rgba(13,75,57,.16)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 12% 7%,rgba(217,182,93,.25),transparent 25%),linear-gradient(145deg,#fffaf0,#edf8f2);color:var(--ink);min-height:100vh}.wrap{width:min(960px,94%);margin:auto;padding:20px 0 120px}header{text-align:center}.logo{width:106px;height:106px;border-radius:50%;border:4px solid var(--gold);background:#fff;box-shadow:var(--shadow)}h1{font-size:clamp(32px,7vw,50px);margin:12px 0 5px;color:var(--g)}.tag{font-size:18px;color:#765d24;font-weight:800}.top{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn,.top a{border:0;text-decoration:none;background:var(--g);color:#fff;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:900;cursor:pointer}.light{background:#e7f4ed!important;color:var(--g)!important}.card{background:rgba(255,255,255,.97);border:1px solid #e2d3aa;border-radius:25px;padding:20px;box-shadow:var(--shadow);margin-top:15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:16px;font-weight:900;color:var(--g)}select,input{width:100%;margin-top:7px;border:2px solid #e1d2a9;border-radius:14px;padding:14px;font-size:17px;background:#fff;outline:none}.surahGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:15px}.surah{border:1px solid #dec98c;background:#fff;border-radius:17px;padding:14px;cursor:pointer;text-align:right;font-size:17px;font-weight:900;color:var(--g)}.surah.active{background:var(--g);color:#fff}.status{text-align:center;font-weight:900;color:var(--g);line-height:1.8}.searchRow{display:grid;grid-template-columns:1fr auto;gap:9px}.results{display:grid;gap:10px;margin-top:12px}.match{border:1px solid #e1d2a9;border-radius:16px;padding:15px;background:#fff}.match strong{color:var(--g)}.match p{font-size:20px;line-height:1.8;margin:8px 0}.matchActions{display:flex;gap:8px;flex-wrap:wrap}.matchActions button,.matchActions a{border:0;text-decoration:none;border-radius:11px;background:#e7f4ed;color:var(--g);padding:10px 13px;font-weight:900;cursor:pointer}.player{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(920px,94%);z-index:20;background:rgba(13,75,57,.97);color:#fff;border:2px solid var(--gold);border-radius:22px;padding:13px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.now{text-align:center;font-weight:900;line-height:1.7}.now span{color:#f4db92}.controls{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:8px}.controls button{border:0;border-radius:12px;background:#fff;color:var(--g);padding:11px 15px;font-size:17px;font-weight:900;cursor:pointer}.controls select{width:auto;margin:0;padding:10px}.progress{height:7px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:var(--gold)}audio{display:none}footer{text-align:center;color:var(--g);font-weight:900;line-height:1.8;padding-top:24px}@media(max-width:700px){.fields{grid-template-columns:1fr}.surahGrid{grid-template-columns:repeat(2,1fr)}.searchRow{grid-template-columns:1fr}.top>*{flex:1;text-align:center}.card{padding:16px}}@media(max-width:420px){.surahGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><img class="logo" src="natsha-family-logo.svg" alt="شعار عائلة النتشة"><h1>الاستماع للقرآن الكريم</h1><div class="tag">اختر السورة والقارئ — وابحث في آيات القرآن</div></header>
<div class="top"><a class="light" href="index.html">🏠 الرئيسية</a><a class="light" href="mushaf.html">📚 المصحف الشريف</a><a class="light" href="radio.html">📻 إذاعة القرآن</a></div>
<div class="card fields"><label>اختر القارئ<select id="reciter"><option>جاري تحميل القراء...</option></select></label><label>ابحث باسم السورة<input id="surahSearch" placeholder="مثال: الكهف أو 18"></label></div>
<div class="card"><div id="surahStatus" class="status">جاري تحميل قائمة السور...</div><div id="surahList" class="surahGrid"></div></div>
<div class="card"><h2 style="color:var(--g);text-align:center">🔎 البحث في آيات القرآن</h2><div class="searchRow"><input id="ayahSearch" placeholder="اكتب كلمتين أو أكثر، مثال: الرحمن علم القرآن"><button class="btn" id="searchBtn">بحث</button></div><div id="searchStatus" class="status"></div><div id="results" class="results"></div></div>
<footer>إعداد وإهداء: غازي خريشة النتشة<br><small>﴿ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا ﴾</small></footer>
</main>
<div class="player"><div class="now" id="now">اختر سورة ثم اضغط تشغيل</div><div class="controls"><button id="prev">⏮ السابق</button><button id="play">▶ تشغيل</button><button id="next">التالي ⏭</button><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></div><div class="progress"><div id="bar" class="bar"></div></div><audio id="audio" preload="metadata"></audio></div>
<script>
const API='https://api.alquran.cloud/v1';
const reciterEl=document.getElementById('reciter'),surahList=document.getElementById('surahList'),surahSearch=document.getElementById('surahSearch'),surahStatus=document.getElementById('surahStatus'),ayahSearch=document.getElementById('ayahSearch'),searchStatus=document.getElementById('searchStatus'),resultsEl=document.getElementById('results'),audio=document.getElementById('audio'),playBtn=document.getElementById('play'),nowEl=document.getElementById('now'),bar=document.getElementById('bar');
let surahs=[],currentSurah=null,audioAyahs=[],audioIndex=0,isPlaying=false,loadingAudio=false;
const fallbackReciters=[['ar.alafasy','مشاري راشد العفاسي'],['ar.abdulbasitmurattal','عبد الباسط عبد الصمد - مرتل'],['ar.husary','محمود خليل الحصري'],['ar.minshawi','محمد صديق المنشاوي'],['ar.abdurrahmaansudais','عبد الرحمن السديس'],['ar.saoodshuraym','سعود الشريم'],['ar.mahermuaiqly','ماهر المعيقلي']];
function ar(n){return Number(n).toLocaleString('ar')}
function normalize(s){return String(s||'').replace(/[أإآ]/g,'ا').replace(/[ًٌٍَُِّْـ]/g,'').trim()}
function setReciters(items){reciterEl.innerHTML='';items.forEach(x=>{const o=document.createElement('option');o.value=x.identifier||x[0];o.textContent=x.name||x[1];reciterEl.appendChild(o)});reciterEl.value=localStorage.natshaReciter||'ar.alafasy';if(!reciterEl.value)reciterEl.selectedIndex=0}
async function loadReciters(){try{const r=await fetch(API+'/edition?format=audio&language=ar&type=versebyverse');const j=await r.json();const items=(j.data||[]).filter(x=>x.identifier&&x.name);items.sort((a,b)=>a.name.localeCompare(b.name,'ar'));setReciters(items.length?items:fallbackReciters)}catch(e){setReciters(fallbackReciters)}}
function renderSurahs(data){surahList.innerHTML='';data.forEach(s=>{const b=document.createElement('button');b.className='surah'+(currentSurah&&currentSurah.number===s.number?' active':'');b.textContent=ar(s.number)+' — '+s.name+' ('+ar(s.numberOfAyahs)+')';b.onclick=()=>selectSurah(s);surahList.appendChild(b)});surahStatus.textContent=data.length?'اختر سورة من القائمة':'لم يتم العثور على سورة'}
async function loadSurahs(){try{const r=await fetch(API+'/surah');const j=await r.json();surahs=j.data||[];renderSurahs(surahs);const last=Number(localStorage.natshaListenSurah||0);if(last){const s=surahs.find(x=>x.number===last);if(s)selectSurah(s,false)}}catch(e){surahStatus.textContent='تعذر تحميل قائمة السور. تحقق من الإنترنت.'}}
function selectSurah(s,scroll=true){currentSurah=s;localStorage.natshaListenSurah=s.number;audio.pause();audio.removeAttribute('src');audio.load();audioAyahs=[];audioIndex=0;isPlaying=false;playBtn.textContent='▶ تشغيل';nowEl.textContent='سورة '+s.name+' — اختر القارئ واضغط تشغيل';renderSurahs(surahs.filter(filterSurah));if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function filterSurah(s){const q=normalize(surahSearch.value);return !q||normalize(s.name).includes(q)||String(s.number)===q}
surahSearch.oninput=()=>renderSurahs(surahs.filter(filterSurah));reciterEl.onchange=()=>{localStorage.natshaReciter=reciterEl.value;if(currentSurah){audio.pause();audioAyahs=[];audioIndex=0;isPlaying=false;playBtn.textContent='▶ تشغيل';nowEl.textContent='تم تغيير القارئ — اضغط تشغيل'}};
async function ensureAudio(startIndex=0){if(!currentSurah)throw new Error('اختر سورة أولًا');if(audioAyahs.length){audioIndex=Math.max(0,Math.min(startIndex,audioAyahs.length-1));setSource();return}if(loadingAudio)return;loadingAudio=true;nowEl.textContent='جاري تحميل تلاوة السورة...';try{const r=await fetch(API+'/surah/'+currentSurah.number+'/'+encodeURIComponent(reciterEl.value));const j=await r.json();audioAyahs=(j.data?.ayahs||[]).filter(a=>a.audio);if(!audioAyahs.length)throw new Error('لا توجد روابط صوت');audioIndex=Math.max(0,Math.min(startIndex,audioAyahs.length-1));setSource()}finally{loadingAudio=false}}
function setSource(){const a=audioAyahs[audioIndex];if(!a)return;audio.src=a.audio;audio.playbackRate=Number(document.getElementById('speed').value);nowEl.innerHTML='سورة <span>'+currentSurah.name+'</span> — الآية <span>'+ar(a.numberInSurah)+'</span> من '+ar(audioAyahs.length)}
async function playFrom(index=audioIndex){try{await ensureAudio(index);await audio.play();isPlaying=true;playBtn.textContent='⏸ إيقاف'}catch(e){isPlaying=false;playBtn.textContent='▶ تشغيل';nowEl.textContent=e.message||'تعذر تشغيل التلاوة. جرّب قارئًا آخر.'}}
playBtn.onclick=()=>{if(isPlaying){audio.pause();isPlaying=false;playBtn.textContent='▶ تشغيل'}else playFrom(audioIndex)};
document.getElementById('prev').onclick=()=>{if(!audioAyahs.length){playFrom(0);return}audioIndex=Math.max(0,audioIndex-1);setSource();playFrom(audioIndex)};
document.getElementById('next').onclick=()=>{if(!audioAyahs.length){playFrom(0);return}audioIndex=Math.min(audioAyahs.length-1,audioIndex+1);setSource();playFrom(audioIndex)};
document.getElementById('speed').onchange=e=>{audio.playbackRate=Number(e.target.value)};audio.onended=()=>{if(audioIndex<audioAyahs.length-1){audioIndex++;setSource();audio.play().catch(()=>{isPlaying=false;playBtn.textContent='▶ تشغيل'})}else{isPlaying=false;playBtn.textContent='▶ تشغيل';nowEl.textContent='اكتملت تلاوة سورة '+currentSurah.name+'، تقبّل الله'}};audio.ontimeupdate=()=>{bar.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'};audio.onerror=()=>{const a=audioAyahs[audioIndex],alt=a?.audioSecondary?.[0];if(alt&&audio.src!==alt){audio.src=alt;audio.play().catch(()=>{})}else{nowEl.textContent='تعذر تشغيل هذه الآية. اضغط التالي أو اختر قارئًا آخر.'}};
async function searchQuran(){const q=ayahSearch.value.trim();resultsEl.innerHTML='';if(q.length<2){searchStatus.textContent='اكتب حرفين على الأقل.';return}searchStatus.textContent='جاري البحث...';try{const r=await fetch(API+'/search/'+encodeURIComponent(q)+'/all/quran-simple-clean');const j=await r.json();const matches=(j.data?.matches||[]).slice(0,50);searchStatus.textContent=matches.length?'تم العثور على '+ar(j.data.count)+' نتيجة — نعرض أول '+ar(matches.length):'لا توجد نتائج';matches.forEach(m=>{const card=document.createElement('div');card.className='match';const title=document.createElement('strong');title.textContent=m.surah.name+' — الآية '+ar(m.numberInSurah);const p=document.createElement('p');p.textContent=m.text;const actions=document.createElement('div');actions.className='matchActions';const open=document.createElement('a');open.href='mushaf.html#surah='+m.surah.number+'&ayah='+m.numberInSurah;open.textContent='📖 فتح الآية';const listen=document.createElement('button');listen.textContent='🎧 التلاوة من هنا';listen.onclick=()=>{const s=surahs.find(x=>x.number===m.surah.number)||{number:m.surah.number,name:m.surah.name,numberOfAyahs:999};selectSurah(s);playFrom(Math.max(0,m.numberInSurah-1))};actions.append(open,listen);card.append(title,p,actions);resultsEl.appendChild(card)})}catch(e){searchStatus.textContent='تعذر البحث الآن. تحقق من الإنترنت وحاول مرة أخرى.'}}
document.getElementById('searchBtn').onclick=searchQuran;ayahSearch.addEventListener('keydown',e=>{if(e.key==='Enter')searchQuran()});
Promise.all([loadReciters(),loadSurahs()]);
</script>
</body>
</html>
